# Reusable workflow: check that a pull request title follows Conventional Commits.
#
# Release notes are drafted from the commits on main. A pull request squash-merged
# with more than one commit lands under its title; one with a single commit keeps
# that commit's own message, which this does not check.
#
# Called from animovement/.github (pr-title-check.yml) and animovement-agents. It is
# not in workflows/stubs/, so the package repositories do not run it. See
# CONTRIBUTING.md for the types.
name: pr-title

on:
  workflow_call:

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest

    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # type(optional scope)optional !: description
          pattern='^(feat|fix|docs|perf|refactor|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'

          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "✔ $TITLE"
            exit 0
          fi

          cat >&2 <<EOF
          ✘ The pull request title is not a Conventional Commit.

              $TITLE

          Expected: <type>(<optional scope>): <description>

              feat(aniread): add read_octron()
              fix(aniprocess): keep metadata through filter_kalman()
              docs: explain the aniframe grouping rules
              feat(anicore)!: drop the deprecated dimension argument

          Types: feat fix docs perf refactor test build ci chore revert
          A breaking change takes a ! before the colon.

          https://github.com/animovement/.github/blob/main/CONTRIBUTING.md#commit-messages
          EOF
          exit 1
