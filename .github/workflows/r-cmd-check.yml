# Reusable workflow: R CMD check across the standard matrix.
# Derived from https://github.com/r-lib/actions/tree/v2/examples
#
# Called by a stub in each package repository. A reusable workflow runs in the
# caller's context, so the checkout and every path below refer to the package
# being checked, not to this repository.
name: R-CMD-check

on:
  workflow_call:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # R-devel has no binaries, so it runs on merges to main, not on PRs.
        config: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('[
            {"os": "macos-latest", "r": "release"},
            {"os": "windows-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "oldrel-1"}
          ]')
          || fromJSON('[
            {"os": "macos-latest", "r": "release"},
            {"os": "windows-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "devel", "http-user-agent": "release"},
            {"os": "ubuntu-latest", "r": "release"},
            {"os": "ubuntu-latest", "r": "oldrel-1"}
          ]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The packages use renv, whose activate.R sets options(repos) from the
      # lockfile -- overriding the P3M binary repo that use-public-rspm
      # configures, so everything would be compiled from source on Linux.
      # CI resolves dependencies from DESCRIPTION, not from the lockfile.
      RENV_CONFIG_AUTOLOADER_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: 'https://animovement.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Bumped when a stale library would otherwise survive: the cache is
          # restored on a prefix match and only added to, never pruned, so a
          # package that has been renamed away stays installed and its S3
          # methods keep winning dispatch (animovement/anicore#127).
          cache-version: 2
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # What CRAN's own checks look at and the matrix above leaves out: the incoming
  # checks (title and description, URLs, dependencies that aren't on CRAN, a new
  # submission) and the PDF manual. check-r-package turns the incoming checks
  # off unless _R_CHECK_CRAN_INCOMING_ is set. Until the suite is on CRAN, this
  # reports rather than fails: what CRAN would say shows as warnings and in the
  # job summary. Set error-on to "note" once a package is ready to submit.
  cran-incoming:
    name: CRAN incoming (ubuntu-latest, release)
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: false
      _R_CHECK_CRAN_INCOMING_: true
      _R_CHECK_CRAN_INCOMING_REMOTE_: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://animovement.r-universe.dev'

      # The PDF manual, which the matrix above skips
      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          build_args: 'c("--compact-vignettes=gs+qpdf")'
          error-on: '"never"'

      - name: Report what CRAN would say
        if: always()
        shell: Rscript {0}
        run: |
          # check-r-package's default check-dir; it doesn't expose the path
          log <- list.files("check", "^00check\\.log$", recursive = TRUE, full.names = TRUE)
          if (length(log) == 0) stop("No check log found.")
          res <- rcmdcheck::parse_check(log[1])
          found <- c(
            stats::setNames(res$errors, rep("ERROR", length(res$errors))),
            stats::setNames(res$warnings, rep("WARNING", length(res$warnings))),
            stats::setNames(res$notes, rep("NOTE", length(res$notes)))
          )
          summary <- c(
            "## What CRAN would say",
            "",
            sprintf("%d errors, %d warnings, %d notes, with CRAN's incoming checks and the PDF manual.", length(res$errors), length(res$warnings), length(res$notes)),
            ""
          )
          for (i in seq_along(found)) {
            first <- sub("\n.*", "", found[[i]])
            # Annotations take one line; the summary keeps the detail
            cat(sprintf("::warning title=CRAN incoming %s::%s\n", names(found)[i], first))
            summary <- c(summary, sprintf("### %s: %s", names(found)[i], first), "", "```", found[[i]], "```", "")
          }
          cat(summary, file = Sys.getenv("GITHUB_STEP_SUMMARY"), sep = "\n", append = TRUE)

  # anicore changes its metadata storage freely because everything outside it
  # goes through get_metadata()/set_metadata() and the variables accessors
  # (animovement/anicore#155). Raw reads are what turned the #118 layout change
  # into a suite-wide migration, so they fail here. A line that genuinely needs
  # the raw attribute opts out with a trailing `# anicore: allow-metadata` on
  # the same line. air moves a comment that trails `{`, so put the raw read in
  # an assignment of its own.
  anicore-metadata-contract:
    if: github.repository != 'animovement/anicore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse raw anicore metadata reads
        run: |
          pattern='attr\([^)]*["'"'"']metadata["'"'"']|\$variables_(what|when|where|index|event)\b|\[\[["'"'"']variables_(what|when|where|index|event)["'"'"']'
          hits=$(grep -rnE "$pattern" R/ --include='*.R' \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
            | grep -v 'anicore: allow-metadata' || true)
          if [ -n "$hits" ]; then
            while IFS=: read -r file line _; do
              echo "::error file=$file,line=$line::Raw anicore metadata access. Use get_metadata(), set_metadata(), get_variables(), get_keys() or get_index() (animovement/anicore#155)."
            done <<< "$hits"
            exit 1
          fi
