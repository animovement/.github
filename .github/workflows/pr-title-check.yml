# Checks this repository's own pull request titles. The reusable workflow it calls
# lives next to it, so this references it by path rather than by `owner/repo@main`
# — a local reference resolves at the pull request's own ref, which means a change
# to the check is exercised by the pull request that makes it.
#
# Any other repository has to call animovement/.github/.github/workflows/pr-title.yml@main
# instead, as animovement-agents does. See CONTRIBUTING.md.
name: pr-title-check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  pr-title:
    uses: ./.github/workflows/pr-title.yml
