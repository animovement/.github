# Renders agents/AGENTS.md.tmpl for every package in agents/packages.tsv and
# opens a pull request in each repository whose copy is out of date.
#
# Needs a token that can write to the other repositories: GITHUB_TOKEN is scoped
# to this one. See agents/README.md for how to create it.
name: Sync AGENTS.md

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without opening pull requests"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "agents/AGENTS.md.tmpl"
      - "agents/packages.tsv"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render and open pull requests
        env:
          GH_TOKEN: ${{ secrets.AGENTS_SYNC_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::AGENTS_SYNC_TOKEN is not set. See agents/README.md."
            exit 1
          fi

          branch="chore/sync-agents-md"
          changed=0

          while IFS=$'\t' read -r pkg role; do
            [ -z "$pkg" ] && continue
            repo="animovement/$pkg"
            echo "::group::$pkg"

            rendered=$(sed -e "s|{{PACKAGE}}|$pkg|g" -e "s|{{ROLE}}|$role|g" agents/AGENTS.md.tmpl)
            new_b64=$(printf '%s' "$rendered" | base64 | tr -d '\n')

            # Compare against what is already on the default branch.
            cur_b64=$(gh api "repos/$repo/contents/AGENTS.md" --jq '.content' 2>/dev/null | tr -d '\n' || true)
            if [ -n "$cur_b64" ] && [ "$(printf '%s' "$cur_b64" | base64 -d | shasum)" = "$(printf '%s' "$rendered" | shasum)" ]; then
              echo "already up to date"
              echo "::endgroup::"
              continue
            fi

            changed=$((changed + 1))
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "would update AGENTS.md"
              echo "::endgroup::"
              continue
            fi

            base_sha=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
            gh api -X POST "repos/$repo/git/refs" -f ref="refs/heads/$branch" -f sha="$base_sha" >/dev/null 2>&1 || \
              gh api -X PATCH "repos/$repo/git/refs/heads/$branch" -f sha="$base_sha" -F force=true >/dev/null

            file_sha=$(gh api "repos/$repo/contents/AGENTS.md?ref=$branch" --jq '.sha' 2>/dev/null || true)
            if [ -n "$file_sha" ] && [ "$file_sha" != "null" ]; then
              gh api -X PUT "repos/$repo/contents/AGENTS.md" \
                -f message="Sync AGENTS.md from animovement/.github" \
                -f content="$new_b64" -f branch="$branch" -f sha="$file_sha" >/dev/null
            else
              gh api -X PUT "repos/$repo/contents/AGENTS.md" \
                -f message="Sync AGENTS.md from animovement/.github" \
                -f content="$new_b64" -f branch="$branch" >/dev/null
            fi

            if [ -z "$(gh pr list -R "$repo" --head "$branch" --state open --json number --jq '.[0].number')" ]; then
              gh pr create -R "$repo" --base main --head "$branch" \
                --title "Sync AGENTS.md" \
                --body "$(printf '%s\n' \
                  "Generated from \`agents/AGENTS.md.tmpl\` in [animovement/.github](https://github.com/animovement/.github), so every package carries the same guidance for coding agents." \
                  "" \
                  "Do not edit this file here — edit the template and re-run the **Sync AGENTS.md** workflow, otherwise the next sync overwrites it." \
                  "" \
                  "Opened automatically by [Sync AGENTS.md](https://github.com/animovement/.github/actions/workflows/sync-agents-md.yml).")" >/dev/null
              echo "pull request opened"
            else
              echo "existing pull request updated"
            fi
            echo "::endgroup::"
          done < agents/packages.tsv

          echo "repositories needing an update: $changed"
