# Reusable workflow: build the pkgdown site and deploy it to gh-pages.
# Derived from https://github.com/r-lib/actions/tree/v2/examples
name: pkgdown

on:
  workflow_call:
    inputs:
      quarto:
        description: "Install Quarto. Needed only where vignettes or articles are .qmd."
        required: false
        default: false
        type: boolean

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # See the note in r-cmd-check.yml.
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2
        if: inputs.quarto

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://animovement.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ inputs.quarto && 'any::pkgdown, any::quarto, local::.' || 'any::pkgdown, local::.' }}
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
