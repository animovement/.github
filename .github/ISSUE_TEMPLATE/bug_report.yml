name: Bug report
description: Something in an animovement package does not work as expected
type: Bug
projects: ["animovement/1"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The fields below are what we need to reproduce it —
        a report with a runnable example is usually fixed far faster than one without.

        For questions rather than bugs, [Zulip](https://animovement.zulipchat.com) is the better place.


  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What went wrong, and what you were trying to do.
    validations:
      required: true

  - type: textarea
    id: reprex
    attributes:
      label: Reproducible example
      description: |
        The smallest piece of code that shows the problem. The [reprex](https://reprex.tidyverse.org)
        package makes this easy — `reprex::reprex({ ... })` runs your code and copies the result,
        output and all, ready to paste here.

        If the problem depends on a particular file, say which tool produced it, and attach a small
        excerpt if you can share one.
      render: r
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: sitrep
    attributes:
      label: Session information
      description: |
        Please paste the output of `animovement::animovement_sitrep()`, which reports your R version
        and the version of every animovement package. If animovement will not load, `sessionInfo()`
        is the next best thing.
      render: text
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, the full error message, or context about what you were working towards.
    validations:
      required: false
